# Blueprint do Render: Render → New + → Blueprint → escolha o repositório novrix-bot → Apply.
# Começa nos planos gratuitos para a fase de testes com o número de teste da Meta.
# Fase de testes SEM banco Postgres (a conta só permite 1 banco gratuito, já usado):
# o robô usa SQLite, que é apagado quando o serviço reinicia. Para o teste, tudo bem.
# Antes de ligar o número real: plano web starter + um banco Postgres pago (basic-256mb),
# adicionando de volta a variável DATABASE_URL (fromDatabase).
services:
  - type: web
    name: novrix-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py criar_admin && gunicorn novrixbot.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /saude/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

