# Blueprint do Render: Render → New + → Blueprint → escolha o repositório novrix-bot → Apply.
# Começa nos planos gratuitos para a fase de testes com o número de teste da Meta.
# Antes de ligar o número real, troque para pago (web: starter; banco: basic-256mb):
# o web gratuito "dorme" sem uso e o banco gratuito expira depois de um tempo.
services:
  - type: web
    name: novrix-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py criar_admin && gunicorn novrixbot.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /saude/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: novrix-bot-banco
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

databases:
  - name: novrix-bot-banco
    plan: free
